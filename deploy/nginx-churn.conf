# /etc/nginx/sites-available/churn  ->  symlink into sites-enabled
# Replace churn.example.com with your domain (or use the server IP as server_name).
server {
    listen 80;
    server_name churn.example.com;
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit needs WebSocket support:
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
# After this works on HTTP, run:  sudo certbot --nginx -d churn.example.com
# Certbot edits this file to add HTTPS (Let's Encrypt certificate).
